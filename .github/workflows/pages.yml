# Publishes the site to GitHub Pages on every push to main:
#   /            → landing page (landing/index.html)
#   /app/        → the app prototype (Vite build)
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app under /<repo>/app/
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/app/
      - name: Assemble site
        run: |
          mkdir -p _site/app
          cp -r landing/. _site/
          cp -r dist/. _site/app/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
